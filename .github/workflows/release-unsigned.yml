name: Build unsigned IPA

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # macos-26 is a GitHub-hosted image (Xcode 26.x by default), which is what
    # this project needs for its iOS 26 deployment target and Icon Composer icon.
    # Use a self-hosted label here only if you build on your own Mac.
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -list -project GestaltEdit.xcodeproj

      - name: Run device profile tests
        run: |
          xcrun swiftc GestaltEdit/GestaltModels.swift Tests/DeviceProfiles/main.swift \
            -o "$RUNNER_TEMP/gestalt-device-tests"
          "$RUNNER_TEMP/gestalt-device-tests"

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project GestaltEdit.xcodeproj \
            -scheme GestaltEdit \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/GestaltEdit.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R \
            "$RUNNER_TEMP/GestaltEdit.xcarchive/Products/Applications/GestaltEdit.app" \
            "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          IPA_NAME="GestaltEdit-${GITHUB_REF_NAME//\//-}-unsigned.ipa"
          zip -qry "$IPA_NAME" Payload
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestaltEdit-unsigned-ipa
          path: ${{ runner.temp }}/${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: GestaltEdit ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/${{ env.IPA_NAME }}
